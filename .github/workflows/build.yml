name: Build Browser and Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.9'

# 同一ブランチの重複 push / PR は最新のビルドのみ維持
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            browser/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install browser dependencies
        working-directory: browser
        run: pnpm install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      - name: Typecheck browser
        working-directory: browser
        run: pnpm exec tsc -b

      - name: Typecheck desktop
        working-directory: desktop
        run: |
          pnpm run typecheck:node
          pnpm run typecheck:web

  detect-changes:
    name: Detect Changed Paths
    # workflow_dispatch 時はフィルタせず全ターゲットをビルド
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            browser:
              - 'browser/**'
              - '.github/workflows/build.yml'
            desktop:
              - 'desktop/**'
              - '.github/workflows/build.yml'

  build-browser:
    name: Build Browser Bundle
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.browser == 'true'))
    defaults:
      run:
        shell: bash
        working-directory: browser
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Upload browser dist
        uses: actions/upload-artifact@v7
        with:
          name: browser-dist
          path: browser/dist
          if-no-files-found: error

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    needs: detect-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && needs.detect-changes.outputs.desktop == 'true'))
    env:
      # Electron / electron-builder のツールチェーンキャッシュ先を固定
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    defaults:
      run:
        shell: bash
        working-directory: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: desktop-linux-x64
          - os: windows-latest
            target: windows
            artifact_name: desktop-windows-x64
          - os: macos-latest
            target: macos
            artifact_name: desktop-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Electron and electron-builder toolchains
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev rpm

      - name: Install dependencies
        run: |
          # desktop/package.json の ajv@<6.14.0 override ('>=6.14.0') により ajv v8 が解決され、
          # electron-builder (@develar/schema-utils / ajv-keywords@3) が起動時にクラッシュする問題を補正
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (pkg.pnpm?.overrides?.["ajv@<6.14.0"] === ">=6.14.0") {
              pkg.pnpm.overrides["ajv@<6.14.0"] = "^6.14.0";
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
          '
          pnpm install --no-frozen-lockfile

      - name: Build desktop application
        run: |
          pnpm run typecheck:node
          pnpm run typecheck:web
          pnpm exec electron-vite build

      - name: Package desktop installer (Linux)
        if: matrix.target == 'linux'
        run: pnpm exec electron-builder --linux --x64 --publish never

      - name: Package desktop installer (Windows)
        if: matrix.target == 'windows'
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Package desktop installer (macOS, unsigned)
        if: matrix.target == 'macos'
        env:
          # CI では macOS のビルド検証のみ行い、署名・公証はスキップする
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          CI_CONFIG="${RUNNER_TEMP}/electron-builder.ci.json"
          cat <<'EOF' > "${CI_CONFIG}"
          {
            "extends": "file:electron-builder.yml",
            "afterSign": null,
            "mac": {
              "artifactName": "${productName}-${version}-${os}-${arch}.${ext}",
              "notarize": false
            },
            "dmg": {
              "sign": false
            }
          }
          EOF
          pnpm exec electron-builder --mac --x64 --arm64 --publish never --config "${CI_CONFIG}"

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/latest*.yml
          if-no-files-found: error
